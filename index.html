<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neopath Technology · Links</title>
  <meta name="description" content="Follow Neopath Technology on Facebook, Instagram and YouTube.">
  <meta property="og:title" content="Neopath Technology · Let's stay connected">
  <meta property="og:description" content="Follow Neopath Technology on Facebook, Instagram and YouTube.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f8f7fa;
      --ink: #10252e;
      --muted: #5b6670;
      --lilac: #efd9ff;
      --purple: #b56ef5;
      --navy: #12272f;
      --cyan: #a3f2f2;
      --red: #ff3b2f;
      --white: #ffffff;
      --radius: 36px;
      --fb: #1877f2;
      --ig: linear-gradient(140deg, #feda75 0%, #fa7e1e 22%, #d62976 52%, #962fbf 78%, #4f5bd5 100%);
      --yt: #ff0000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 40px;
      overflow-x: hidden;
    }

    /* ---------- Header ---------- */
    .brand {
      display: inline-block;
    }

    .brand img {
      width: min(340px, 78vw);
      height: auto;
      display: block;
    }

    header {
      text-align: center;
      max-width: 720px;
    }

    h1 {
      margin-top: 28px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-size: clamp(40px, 6.5vw, 72px);
      line-height: 1.02;
      letter-spacing: -0.02em;
    }

    h1 em {
      font-style: italic;
      /* room for the italic overhang, which background-clip would otherwise cut off */
      padding: 0 .15em 0 .05em;
      margin: 0 -.15em 0 -.05em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      background: linear-gradient(90deg, var(--fb), #d62976 50%, var(--yt));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      margin: 18px auto 0;
      max-width: 460px;
      font-size: 17px;
      line-height: 1.55;
      color: var(--muted);
    }

    /* ---------- Cards ---------- */
    .cards {
      width: 100%;
      max-width: 1180px;
      margin-top: 52px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 500px;
      padding: 34px;
      border-radius: var(--radius);
      overflow: hidden;
      isolation: isolate;
      text-decoration: none;
      color: var(--white);
      transition: transform .45s cubic-bezier(.2, .9, .3, 1.3), box-shadow .45s ease;
      box-shadow: 0 1px 0 rgba(16, 37, 46, .04);
      animation: rise .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .card:nth-child(2) {
      animation-delay: .1s;
    }

    .card:nth-child(3) {
      animation-delay: .2s;
    }

    .card:hover {
      transform: translateY(-10px) rotate(-1deg);
      box-shadow: 0 30px 60px -20px var(--glow);
    }

    .card:nth-child(2):hover {
      transform: translateY(-10px) rotate(1deg);
    }

    .card:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 5px;
    }

    .card .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .platform {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 19px;
    }

    .platform svg {
      width: 30px;
      height: 30px;
    }

    /* big brand logos */
    .logo {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .25));
      transition: transform .5s cubic-bezier(.2, .9, .3, 1.5);
      animation: bob 4.5s ease-in-out infinite;
    }

    .logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card:hover .logo {
      transform: scale(1.12) rotate(-6deg);
    }

    .card h2 {
      position: relative;
      z-index: 2;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-size: clamp(30px, 3.2vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .eyebrow {
      position: relative;
      z-index: 2;
      font-family: "Fraunces", Georgia, serif;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .pill {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 10px 18px;
      border: 1.5px solid currentColor;
      border-radius: 999px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 16px;
      font-weight: 500;
      transition: background .3s ease, color .3s ease, gap .3s ease;
    }

    .pill .arrow {
      transition: transform .3s ease;
    }

    .card:hover .pill {
      gap: 12px;
    }

    .card:hover .pill .arrow {
      transform: translateX(3px);
    }

    .handle {
      font-size: 13px;
      font-weight: 500;
      opacity: .9;
    }

    /* decorative shapes */
    .shape {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      aspect-ratio: 1 / 1;
      height: auto;
      transition: transform .7s cubic-bezier(.2, .9, .3, 1.2);
    }

    .float {
      animation: float 6s ease-in-out infinite;
    }

    .float2 {
      animation: float 7.5s ease-in-out infinite reverse;
    }

    .spin {
      animation: spin 22s linear infinite;
    }

    /* Card 1 — Facebook blue */
    .fb {
      background: var(--fb);
      --glow: rgba(24, 119, 242, .55);
    }

    .fb h2 {
      margin-top: 26px;
    }

    .fb .blob {
      width: 82%;
      left: 44%;
      bottom: -26%;
      color: #5aa2ff;
    }

    .fb .burst {
      width: 13%;
      right: 8%;
      bottom: 33%;
      color: rgba(255, 255, 255, .9);
    }

    .fb .star {
      width: 10%;
      right: 12%;
      bottom: 9%;
      color: #0a3d91;
    }

    .fb .spark {
      width: 7%;
      left: 10%;
      bottom: 14%;
      color: #ffd84d;
    }

    .fb .logo {
      width: 40%;
      margin-top: auto;
      align-self: center;
    }

    .fb:hover .blob {
      transform: translateY(-6%) rotate(8deg);
    }

    .fb:hover .pill {
      background: var(--white);
      color: var(--fb);
    }

    /* Card 2 — Instagram gradient */
    .ig {
      background: var(--ig);
      --glow: rgba(214, 41, 118, .55);
    }

    .ig .hero {
      position: relative;
      z-index: 2;
      width: 34%;
      margin: auto 0;
      padding: 24px 0;
      align-self: center;
    }

    .ig .frame {
      position: absolute;
      z-index: -1;
      left: 78%;
      top: 30%;
      width: 165%;
      translate: -50% -50%;
      color: var(--white);
      transition: transform .7s cubic-bezier(.2, .9, .3, 1.2);
    }

    .ig .frame svg {
      width: 100%;
      display: block;
    }

    .ig .glyph {
      position: relative;
    }

    .ig .glyph svg {
      width: 100%;
      display: block;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .35));
      transition: transform .5s cubic-bezier(.2, .9, .3, 1.5);
    }

    .ig:hover .frame>svg {
      transform: rotate(45deg) scale(1.04);
    }

    .ig .frame>svg {
      transition: transform .7s cubic-bezier(.2, .9, .3, 1.2);
    }

    .ig:hover .glyph svg {
      transform: rotate(-8deg) scale(1.12);
    }

    .ig .square {
      width: 6%;
      left: 9%;
      top: 22%;
      color: #feda75;
    }

    .ig .star {
      width: 17%;
      right: 9%;
      top: 15%;
      color: #4f5bd5;
    }

    .ig .spark {
      width: 7%;
      right: 9%;
      bottom: 30%;
      color: var(--white);
    }

    .card .bottom {
      position: relative;
      z-index: 2;
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .ig h2 {
      font-size: clamp(26px, 2.6vw, 34px);
    }

    .card .bottom .pill {
      margin-top: 0;
    }

    .ig:hover .pill {
      background: var(--white);
      color: #d62976;
    }

    /* Card 3 — YouTube red */
    .yt {
      background: var(--yt);
      --glow: rgba(255, 0, 0, .5);
    }

    .yt .cyan {
      width: 80%;
      left: -30%;
      top: -42%;
      color: #c80000;
    }

    .yt .burst {
      width: 18%;
      right: 5%;
      bottom: 25%;
      color: #ffb3b3;
    }

    .yt .spark {
      width: 6%;
      right: 46%;
      bottom: 22%;
      color: var(--white);
    }

    .yt .logo {
      width: 42%;
    }

    .yt h2 {
      margin-top: 26px;
    }

    .yt:hover .cyan {
      transform: rotate(-12deg) scale(1.05);
    }

    .yt:hover .pill {
      background: var(--white);
      color: var(--yt);
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    footer a {
      color: inherit;
    }

    @keyframes float {

      0%,
      100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -8px;
      }
    }

    @keyframes spin {
      to {
        rotate: 360deg;
      }
    }

    @keyframes bob {

      0%,
      100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -10px;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 960px) {
      .cards {
        grid-template-columns: 1fr;
        max-width: 460px;
        gap: 22px;
      }

      .card {
        min-height: 0;
      }

      .card h2 {
        font-size: clamp(30px, 8.5vw, 42px);
      }

      .ig h2 {
        font-size: clamp(24px, 7vw, 32px);
      }

      .fb .logo {
        width: 32%;
        margin-top: 28px;
      }

      .ig .hero {
        margin: 44px 0 36px;
      }

      .ig .frame {
        top: 36%;
        width: 150%;
      }

      .yt .bottom {
        margin-top: 28px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 40px 16px 32px;
      }

      .card {
        padding: 26px;
        border-radius: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

    <!-- YouTube -->
